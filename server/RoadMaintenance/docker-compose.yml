services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: RoadMaintenanceMain
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: camil123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Database=RoadMaintenanceMain;Username=postgres;Password=camil123"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
